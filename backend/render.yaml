# Render 部署配置
# 在 Render 中选择 "Deploy a Web Service" 时可以使用此配置

services:
  - type: web
    name: peter-world-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
    disk:
      name: data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
